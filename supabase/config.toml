project_id = "planejador-financeiro"

[auth]
enable_signup = false

# O verify_jwt abaixo vale so para deploy por CLI. Publicacao por colagem no
# painel religa o toggle Verify JWT: reconferir depois de cada colagem.
# Tabela por function e sintomas: AGENTS.md, secao Publicacao e rollback.
[functions.admin-users]
verify_jwt = true

[functions.selic-sync]
# A chamada vem apenas do Supabase Cron e e autenticada pelo header secreto.
verify_jwt = false

[functions.reverse-goal-cleanup]
# A chamada vem apenas do Supabase Cron e e autenticada pelo header secreto.
verify_jwt = false

[functions.widget-setup]
verify_jwt = true

[functions.widget-data]
verify_jwt = false
