# Keep-alive do cluster Qdrant free (fase 3; design-rag-fase0.md, D6) —
# o cluster free suspende após 1 semana sem queries (e é deletado após 4
# semanas suspenso). Uma atividade real por dia basta: este workflow roda
# scripts/qdrant-setup.mjs (idempotente, env-first), que verifica as 3
# coleções, mostra contagens e faz um smoke upsert→leitura→delete na
# `codigo` — escrita real, sem npm/pip install, ~30 s. Coleção existente
# é apenas verificada, nunca recriada (nenhum risco aos pontos indexados).
# Disparo: cron diário 13:30 UTC (10:30 BRT) + workflow_dispatch (teste).
# Nota: o GitHub desativa schedules após 60 dias sem atividade no repo;
# se ocorrer, reativar em Actions → keep-alive-rag → Enable workflow.
name: keep-alive-rag

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping real no cluster (verificação idempotente + smoke)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: node scripts/qdrant-setup.mjs
