name: Alias Preview to QA

on:
  deployment_status

permissions:
  pull-requests: write

jobs:
  alias-and-comment:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar deploy da Vercel terminar
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        id: waitForVercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Instalar Vercel CLI
        run: npm i -g vercel

      - name: Fixar alias QA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel alias set "${{ steps.waitForVercel.outputs.url }}" dindin-10-qa.vercel.app --scope anke4 --token=$VERCEL_TOKEN

      - name: Resolver PR pela branch do deployment
        id: findPr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.deployment.ref;
            console.log('branch do deployment:', branch);
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (prs.length === 0) {
              core.setFailed(`Nenhuma PR aberta encontrada para a branch ${branch}`);
              return;
            }
            core.setOutput('number', prs[0].number);

      - name: Comentar na PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.findPr.outputs.number }}
          message: |
            🔗 **Ambiente de QA atualizado para esta PR**
            Acesse: https://dindin-10-qa.vercel.app
