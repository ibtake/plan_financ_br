name: Alias Preview to QA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

concurrency:
  group: alias-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  alias-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar Vercel iniciar o deployment
        run: sleep 30

      - name: Aguardar deploy da Vercel terminar
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        id: waitForVercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Instalar Vercel CLI
        run: npm i -g vercel

      - name: Fixar alias QA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel alias set "${{ steps.waitForVercel.outputs.url }}" dindin-10-qa.vercel.app --scope anke4 --token=$VERCEL_TOKEN

      - name: Comentar na PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.pull_request.number }}
          message: |
            🔗 **Ambiente de QA atualizado para esta PR**
            Acesse: https://dindin-10-qa.vercel.app
