name: Nightly Deep Scan

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  
jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Deep Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}                                  # ex: openai/gpt-5.4 ou o nome do modelo no parceiro
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}                              # chave do parceiro (enviada como Bearer token)
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}                            # URL base do parceiro
        run: strix -n -t ./ --scan-mode deep --scope-mode full --max-budget 25
