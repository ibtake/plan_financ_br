# Reindex do RAG (fase 5, rev d; IMPR-008: dual-transporte) — rebuild da
# coleção `codigo` a partir do código da main. Disparo: push na main (o índice
# acompanha a produção) + workflow_dispatch manual. Runs são serializados
# por concurrency (rebuild + upsert nunca correm em paralelo — pushes em
# sequência viram fila). Branches/PR não disparam de propósito: o valor
# `repo` no payload é único e runs concorrentes de branches diferentes se
# apagariam mutuamente.
#
# IMPR-008: RAG_TRANSPORTE (vars do repo, default qdrant) escolhe o destino:
#   qdrant   = id uuidv5, embedding Qdrant Cloud Inference (e5-small, fases 1-5);
#   pinecone = id string 'codigo:<repo>:<caminho>:<linha>', namespace 'codigo'
#              do índice único, embedding por texto (integrated inference,
#              modelo do índice = multilingual-e5-large, cota própria 5M tokens).
# O índice é cache: rodar de novo é sempre seguro (ids determinísticos).
#
# Revisão d: o embedding é SERVER-SIDE (Qdrant Cloud Inference, modelo
# intfloat/multilingual-e5-small via Inference Object { text, model }) — não
# há mais job de paridade Node x Python (D1 obsoleto: um único embedder) nem
# instalação de torch/sentence-transformers. O job é só chunk → upsert e roda
# em ~1 minuto. O gate de paridade da fase 2 (scripts/rag/parity.mjs) saiu do
# pipeline ativo junto com embed.py (mantidos no repo como fallback
# documentado — ver scripts/rag/modelo.mjs).
#
# O índice é cache: rodar de novo é sempre seguro (ids determinísticos).
name: reindex-rag

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reindex-rag
  cancel-in-progress: false # fila, nunca corrida (o rebuild é delete+upsert)

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sha_arquivo/data_commit precisam do histórico do git
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chunk e upsert da coleção codigo (dual-transporte por RAG_TRANSPORTE)
        env:
          # IMPR-008: RAG_TRANSPORTE em vars do repo (aba Variables, NÃO secret).
          # Sem a var ou em branco, o default é qdrant — com log EXPLÍCITO do
          # transporte usado para nunca mais haver "verde no lugar errado".
          RAG_TRANSPORTE: ${{ vars.RAG_TRANSPORTE == '' && 'qdrant' || vars.RAG_TRANSPORTE }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          echo "RAG_TRANSPORTE = $RAG_TRANSPORTE"
          node scripts/rag/chunk.mjs --json rag-chunks.json
          node scripts/rag/upsert.mjs rag-chunks.json
          rm -f rag-chunks.json
