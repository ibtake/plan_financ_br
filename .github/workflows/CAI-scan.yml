name: CAI Weekly Security Scan

# Dispara toda segunda-feira às 06:00 UTC (03:00 em São Paulo)
# e também permite acionamento manual via "Run workflow".
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Alvo autorizado da varredura (URL, host ou repo)"
        required: true
        default: "https://your-authorized-target.example.com"
      confirm_authorization:
        description: "Confirmo que possuo autorização explícita para testar este alvo"
        required: true
        type: boolean
        default: false
      max_turns:
        description: "Limite de turnos por agente (segurança contra loops)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  cai-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trava de segurança: em execução manual, exige confirmação explícita.
      # Em execução agendada, usa o alvo fixo definido no repo (variável abaixo).
      - name: Validar autorização (execução manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm_authorization }}" != "true" ]; then
            echo "::error::Confirmação de autorização não marcada. Abortando."
            exit 1
          fi

      - name: Definir alvo da varredura
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "max_turns=${{ inputs.max_turns }}" >> "$GITHUB_OUTPUT"
          else
            # Alvo usado nas execuções agendadas semanais.
            # Configure em Settings > Secrets and variables > Actions > Variables
            echo "target=${{ vars.WEEKLY_SCAN_TARGET }}" >> "$GITHUB_OUTPUT"
            echo "max_turns=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ferramentas de recon usadas pelo agente via generic_linux_command
      - name: Instalar ferramentas de segurança
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap whatweb curl dnsutils

      - name: Instalar CAI
        run: pip install --upgrade pip cai-framework python-dotenv

      - name: Rodar varredura com CAI
        env:
          # Mapeamento dos secrets solicitados para as variáveis que o CAI espera
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.LLM_API_BASE }}
          CAI_MODEL: ${{ secrets.STRIX_LLM }}
          PROMPT_TOOLKIT_NO_CPR: "1"
          TARGET: ${{ steps.target.outputs.target }}
          MAX_TURNS: ${{ steps.target.outputs.max_turns }}
          OUTPUT_DIR: ${{ github.workspace }}/reports
        run: python scripts/cai_scan.py

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cai-security-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
